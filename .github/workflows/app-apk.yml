name: Android APK

on:
  push:
    branches: [main]
    paths: [app/**, .github/workflows/app-apk.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/atchou.jks"
          echo "ATCHOU_KEYSTORE=$RUNNER_TEMP/atchou.jks" >> "$GITHUB_ENV"
      - name: Build the signed release APK
        run: ./gradlew --no-daemon assembleRelease
        working-directory: app
        env:
          ATCHOU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ATCHOU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ATCHOU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: atchou-apk
          path: app/app/build/outputs/apk/release/*.apk
